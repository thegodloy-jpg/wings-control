# =============================================================================
#  三容器架构 Docker Compose — MiniMax-M2.7 高级特性测试版
#  容器: wings-accel (init) + wings-control (sidecar) + engine (推理)
#
#  适用场景: MiniMax-M2.7 MoE 单机推理部署 (NVIDIA GPU)
#            开启 KV 内存卸载、KV 稀疏、无草稿模型投机推理，用作高级特性测试
#
#  默认引擎: vLLM
#  默认模型: MiniMax-M2.7 (TP=4, MoE 架构 MiniMaxM2ForCausalLM)
#
#  注意: 本文件默认使用 GPU 4,5,6,7，端口与基础测试版错开。
#        可与 docker-compose-3c-minimax-m27.yml 同时启动做对照测试。
#
#  使用方法:
#    1. 根据实际环境修改下方 x-user-config 中的模型路径、镜像版本、设备数
#
#    2. 启动:
#       docker compose -f docker-compose-3c-minimax-m27-advanced.yml up -d
#
#    3. 查看 control 生成的启动脚本:
#       docker compose -f docker-compose-3c-minimax-m27-advanced.yml exec wings-control-minimax-m27-advanced \
#         cat /shared-volume/start_command.sh
#
#    4. 查看日志:
#       docker compose -f docker-compose-3c-minimax-m27-advanced.yml logs -f
#
#    5. 测试推理:
#       curl http://localhost:18001/v1/chat/completions \
#         -H "Content-Type: application/json" \
#         -d '{"model":"MiniMax-M2.7","messages":[{"role":"user","content":"hello"}],"max_tokens":32}'
#
#    6. 停止:
#       docker compose -f docker-compose-3c-minimax-m27-advanced.yml down
#
# =============================================================================
version: "3.8"

# ======================== 用户自定义配置 ========================
# 修改此处适配不同环境，无需改动下方 services 定义
x-user-config:
  # -- 镜像版本 --
  wings-version: &wings-version "26.0.0"
  accel-image:   &accel-image   "fusionregistry:5000/wings-accel:26.0.0"
  control-image: &control-image "fusionregistry:5000/wings-control:26.0.0"
  engine-image:  &engine-image  "wings-vllm:v0.19.0-202604162107"

  # -- 模型配置 --
  model-name:      &model-name    "MiniMax-M2.7"
  model-path:      &model-path    "/models/MiniMax-M2.7"
  # 宿主机上模型文件的实际路径（修改后需同步更新 x-model-volume）
  host-model-dir:  "/var/aispace/model/ai-storage/ai-prod/platform/MiniMax-M2.7"

  # -- 设备配置 --
  device-type:     "nvidia"                     # nvidia | ascend
  device-count:    &device-count  "4"
  # NVIDIA: 逗号分隔的 GPU ID；Ascend: NPU ID
  visible-devices: &visible-devices "4,5,6,7"

# 模型挂载卷（修改模型路径时，同步修改此处的 宿主路径:容器路径）
x-model-volume: &model-volume "/var/aispace/model/ai-storage/ai-prod/platform/MiniMax-M2.7:/models/MiniMax-M2.7:ro"

services:
  # ==================== 1. Accel Init 容器 ====================
  accel-init-minimax-m27-advanced:
    image: *accel-image
    container_name: wings-accel-init-minimax-m27-advanced
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo '[accel-init] Copying accel packages to /accel-volume...';
        cp -r /opt/packages/. /accel-volume/;
        echo '[accel-init] Done. Accel packages:';
        ls -la /accel-volume/;
        echo '[accel-init] Exiting.'
    volumes:
      - accel-vol-minimax-m27-advanced:/accel-volume

  # ==================== 2. Wings Control 容器 ====================
  wings-control-minimax-m27-advanced:
    image: *control-image
    container_name: wings-control-minimax-m27-advanced
    network_mode: "host"
    restart: "no"
    command: ["sleep", "infinity"]
    depends_on:
      accel-init-minimax-m27-advanced:
        condition: service_completed_successfully
    volumes:
      - shared-vol-minimax-m27-advanced:/shared-volume
      - accel-vol-minimax-m27-advanced:/accel-volume:ro
      - *model-volume

  # ==================== 3. Engine 容器 ====================
  engine-minimax-m27-advanced:
    image: *engine-image
    container_name: wings-engine-minimax-m27-advanced
    network_mode: "host"
    shm_size: "16g"
    restart: "no"
    depends_on:
      accel-init-minimax-m27-advanced:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    # -- NVIDIA GPU 配置 --
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: *visible-devices
    command:
      - |
        echo '[engine] Waiting for start_command.sh...';
        timeout=3600; elapsed=0;
        while [ ! -f /shared-volume/start_command.sh ]; do
          sleep 2; elapsed=$$((elapsed+2));
          if [ $$elapsed -ge $$timeout ]; then
            echo "[engine] ERROR: Timeout ($${timeout}s) waiting for start_command.sh";
            exit 1;
          fi;
        done;
        echo "[engine] Found start_command.sh after $${elapsed}s";
        echo '========== start_command.sh content ==========';
        cat /shared-volume/start_command.sh;
        echo '===============================================';
        bash /shared-volume/start_command.sh
    volumes:
      - shared-vol-minimax-m27-advanced:/shared-volume
      - accel-vol-minimax-m27-advanced:/accel-volume:ro
      - *model-volume

volumes:
  shared-vol-minimax-m27-advanced:
  accel-vol-minimax-m27-advanced:
