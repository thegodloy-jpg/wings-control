version: "3.8"

services:
  wings-control:
    image: wings-control:test
    ports:
      - "18000:18000"
      - "19000:19000"
    environment:
      ENGINE: vllm
      MODEL_NAME: Qwen3.5-27B
      MODEL_PATH: /models/Qwen3.5-27B
      WINGS_SKIP_PID_CHECK: "true"
      BACKEND_URL: "http://127.0.0.1:17000"
      DEVICE_COUNT: "2"
      ENABLE_REASON_PROXY: "true"
    volumes:
      - shared-vol:/shared-volume
      - /data/models/Qwen3.5-27B:/models/Qwen3.5-27B:ro
    network_mode: "host"
    restart: "no"

  engine:
    image: vllm/vllm-openai:v0.17.0
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1"
    command: >
      /bin/sh -c "echo 'Waiting for start_command.sh...';
      while [ ! -f /shared-volume/start_command.sh ]; do sleep 2; done;
      echo 'Found start_command.sh, executing...';
      cat /shared-volume/start_command.sh;
      bash /shared-volume/start_command.sh"
    volumes:
      - shared-vol:/shared-volume
      - /data/models/Qwen3.5-27B:/models/Qwen3.5-27B:ro
    shm_size: "16g"
    network_mode: "host"
    restart: "no"

volumes:
  shared-vol:
