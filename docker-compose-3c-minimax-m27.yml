# =============================================================================
#  三容器架构 Docker Compose — MiniMax-M2.7
#  容器: wings-accel (init) + wings-control (sidecar) + engine (推理)
#
#  适用场景: MiniMax-M2.7 MoE 单机推理部署 (NVIDIA GPU)
#  默认引擎: vLLM
#  默认模型: MiniMax-M2.7 (TP=8, MoE 架构 MiniMaxM2ForCausalLM)
#
#  注意: M2.7 为大型 MoE 模型, 建议使用 4×GPU (80GB+) 或更多
#        FP8 量化权重在 TP=8 下 MoE 层尺寸不对齐 (192%128≠0)，推荐 TP=4
#
#  使用方法:
#    1. 根据实际环境修改下方 x-user-config 中的模型路径、镜像版本、设备数
#
#    2. 启动:
#       docker compose -f docker-compose-3c-minimax-m27.yml up -d
#
#    3. 查看 control 生成的启动脚本:
#       docker compose -f docker-compose-3c-minimax-m27.yml exec wings-control \
#         cat /shared-volume/start_command.sh
#
#    4. 查看日志:
#       docker compose -f docker-compose-3c-minimax-m27.yml logs -f
#
#    5. 测试推理:
#       curl http://localhost:18000/v1/chat/completions \
#         -H "Content-Type: application/json" \
#         -d '{"model":"MiniMax-M2.7","messages":[{"role":"user","content":"hello"}],"max_tokens":32}'
#
#    6. 停止:
#       docker compose -f docker-compose-3c-minimax-m27.yml down
#
# =============================================================================
version: "3.8"

# ======================== 用户自定义配置 ========================
# 修改此处适配不同环境，无需改动下方 services 定义
x-user-config:
  # -- 镜像版本 --
  wings-version: &wings-version "26.0.0"
  accel-image:   &accel-image   "fusionregistry:5000/wings-accel:26.0.0"
  control-image: &control-image "fusionregistry:5000/wings-control:26.0.0"
  engine-image:  &engine-image  "wings-vllm:v0.19.0-202604162107"

  # -- 模型配置 --
  model-name:      &model-name    "MiniMax-M2.7"
  model-path:      &model-path    "/models/MiniMax-M2.7"
  # 宿主机上模型文件的实际路径（修改后需同步更新 x-model-volume）
  host-model-dir:  "/var/aispace/model/ai-storage/ai-prod/platform/MiniMax-M2.7"

  # -- 设备配置 --
  device-type:     "nvidia"                     # nvidia | ascend
  device-count:    &device-count  "4"
  # NVIDIA: 逗号分隔的 GPU ID；Ascend: NPU ID
  visible-devices: &visible-devices "0,1,2,3"

# 模型挂载卷（修改模型路径时，同步修改此处的 宿主路径:容器路径）
x-model-volume: &model-volume "/var/aispace/model/ai-storage/ai-prod/platform/MiniMax-M2.7:/models/MiniMax-M2.7:ro"

# ======================== 公共环境变量 ========================
x-common-env: &common-env
  WINGS_SKIP_PID_CHECK: "true"
  ENABLE_REASON_PROXY: "true"
  ENGINE: vllm
  ENGINE_VERSION: "v0.19.0"
  MODEL_NAME: *model-name
  MODEL_PATH: *model-path
  DEVICE_COUNT: *device-count
  ENABLE_ACCEL: "true"
  WINGS_ACCEL_DIR: "/accel-volume"
  ENABLE_SPECULATIVE_DECODE: "false"

services:
  # ==================== 1. Accel Init 容器 ====================
  accel-init:
    image: *accel-image
    container_name: wings-accel-init
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo '[accel-init] Copying accel packages to /accel-volume...';
        cp -r /opt/packages/. /accel-volume/;
        echo '[accel-init] Done. Accel packages:';
        ls -la /accel-volume/;
        echo '[accel-init] Exiting.'
    volumes:
      - accel-vol:/accel-volume

  # ==================== 2. Wings Control 容器 ====================
  wings-control:
    image: *control-image
    container_name: wings-control
    network_mode: "host"
    restart: "no"
    # 取消注释以下行启用调试模式（容器保持运行，手动进入执行命令）
    command: ["sleep", "infinity"]
    depends_on:
      accel-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      ENGINE_PORT: "17000"
      PORT: "18000"
      HEALTH_PORT: "19000"
      MONITOR_PROXY_PORT: "19100"
      BACKEND_URL: "http://127.0.0.1:17000"
    volumes:
      - shared-vol:/shared-volume
      - accel-vol:/accel-volume:ro
      - *model-volume

  # ==================== 3. Engine 容器 ====================
  engine:
    image: *engine-image
    container_name: wings-engine
    network_mode: "host"
    shm_size: "16g"
    restart: "no"
    depends_on:
      accel-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    # -- NVIDIA GPU 配置 --
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: *visible-devices
    command:
      - |
        echo '[engine] Waiting for start_command.sh...';
        timeout=3600; elapsed=0;
        while [ ! -f /shared-volume/start_command.sh ]; do
          sleep 2; elapsed=$$((elapsed+2));
          if [ $$elapsed -ge $$timeout ]; then
            echo "[engine] ERROR: Timeout ($${timeout}s) waiting for start_command.sh";
            exit 1;
          fi;
        done;
        echo "[engine] Found start_command.sh after $${elapsed}s";
        echo '========== start_command.sh content ==========';
        cat /shared-volume/start_command.sh;
        echo '===============================================';
        bash /shared-volume/start_command.sh
    volumes:
      - shared-vol:/shared-volume
      - accel-vol:/accel-volume:ro
      - *model-volume

volumes:
  shared-vol:
  accel-vol:
