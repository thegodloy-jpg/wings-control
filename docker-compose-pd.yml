# =============================================================================
#  PD 分离 (Prefill-Decode Disaggregation) 测试 Docker Compose
#  模型: Qwen3-8B (16G, TP=1)
#  目标机器: 7.6.52.170 (16×Ascend 910B2C)
#  使用 NPU 8 (Prefill) + NPU 9 (Decode)
# =============================================================================
#
#  前提条件:
#    - wings_control 代码已部署在 /data/zhanghui/wings-control/
#    - Qwen3-8B 模型在 /data/xqr/Qwen3-8B/
#    - vllm-ascend:v0.17.0rc1 镜像已拉取
#    - 注意: 此方案不需要构建额外镜像，直接使用 vllm-ascend 镜像
#      挂载 wings_control 代码，因为 vllm-ascend 已包含所有依赖
#
#  使用方法:
#    1. 启动 PD 分离测试:
#       cd /data/zhanghui/wings-control
#       docker compose -f docker-compose-pd.yml up -d
#
#    2. 查看 P 节点生成的启动脚本:
#       docker exec pd-test-engine-p cat /shared-volume/start_command.sh
#
#    3. 查看日志:
#       docker compose -f docker-compose-pd.yml logs -f
#
#    4. 测试推理:
#       curl http://localhost:18000/v1/chat/completions \
#         -H "Content-Type: application/json" \
#         -d '{"model":"Qwen3-8B","messages":[{"role":"user","content":"hello"}],"max_tokens":32}'
#
#    5. 停止:
#       docker compose -f docker-compose-pd.yml down
#
# =============================================================================
version: "3.8"

x-common-env: &common-env
  WINGS_SKIP_PID_CHECK: "true"
  ENABLE_REASON_PROXY: "true"
  DEVICE: ascend
  DEVICE_COUNT: "1"
  MODEL_NAME: Qwen3-8B
  MODEL_PATH: /models/Qwen3-8B
  ENGINE: vllm_ascend
  RANK_IP: "7.6.52.170"

x-ascend-mounts: &ascend-mounts
  - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
  - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
  - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
  - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
  - /usr/local/dcmi:/usr/local/dcmi:ro
  - /etc/ascend_install.info:/etc/ascend_install.info:ro
  - /etc/hccn.conf:/etc/hccn.conf:ro

services:
  # ===================== Prefill 节点 (kv_producer) =====================
  wings-control-p:
    image: quay.io/ascend/vllm-ascend:v0.17.0rc1
    container_name: pd-test-control-p
    network_mode: "host"
    restart: "no"
    environment:
      <<: *common-env
      PD_ROLE: "P"
      ENGINE_PORT: "17000"
      PORT: "18000"
      HEALTH_PORT: "19000"
      MONITOR_PROXY_PORT: "19100"
      BACKEND_URL: "http://127.0.0.1:17000"
      VLLM_LLMDD_RPC_PORT: "5569"
      VLLM_MOONCAKE_BOOTSTRAP_PORT: "23000"
      PYTHONPATH: "/opt:/opt/wings-control"
      APP_WORKDIR: "/opt/wings-control"
    working_dir: /opt
    command: >
      /bin/sh -c "
        mkdir -p /shared-volume /var/log/wings /opt/log_analyzer;
        ln -sf /opt/wings-control /opt/wings_control;
        echo '[control-p] Starting wings_control (PD_ROLE=P)...';
        python3 -m wings_control
      "
    volumes:
      - shared-vol-p:/shared-volume
      - /data/xqr/Qwen3-8B:/models/Qwen3-8B:ro
      # 挂载 wings_control 代码
      - /data/zhanghui/wings-control:/opt/wings-control:ro

  engine-p:
    image: quay.io/ascend/vllm-ascend:v0.17.0rc1
    container_name: pd-test-engine-p
    network_mode: "host"
    shm_size: "16g"
    restart: "no"
    ipc: host
    environment:
      ASCEND_VISIBLE_DEVICES: "8"
      ASCEND_RT_VISIBLE_DEVICES: "8"
    command: >
      /bin/sh -c "echo '[engine-p] Waiting for start_command.sh...';
      timeout=180; elapsed=0;
      while [ ! -f /shared-volume/start_command.sh ]; do
        sleep 2; elapsed=$$((elapsed+2));
        if [ $$elapsed -ge $$timeout ]; then
          echo '[engine-p] ERROR: Timeout waiting for start_command.sh';
          exit 1;
        fi;
      done;
      echo '[engine-p] Found start_command.sh after $${elapsed}s';
      echo '====== start_command.sh content ======';
      cat /shared-volume/start_command.sh;
      echo '======================================';
      bash /shared-volume/start_command.sh"
    volumes:
      - shared-vol-p:/shared-volume
      - /data/xqr/Qwen3-8B:/models/Qwen3-8B:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - /etc/hccn.conf:/etc/hccn.conf:ro
    depends_on:
      - wings-control-p

  # ===================== Decode 节点 (kv_consumer) =====================
  wings-control-d:
    image: quay.io/ascend/vllm-ascend:v0.17.0rc1
    container_name: pd-test-control-d
    network_mode: "host"
    restart: "no"
    environment:
      <<: *common-env
      PD_ROLE: "D"
      ENGINE_PORT: "17100"
      PORT: "18100"
      HEALTH_PORT: "19200"
      MONITOR_PROXY_PORT: "19300"
      BACKEND_URL: "http://127.0.0.1:17100"
      VLLM_LLMDD_RPC_PORT: "5570"
      VLLM_MOONCAKE_BOOTSTRAP_PORT: "23100"
      PYTHONPATH: "/opt:/opt/wings-control"
      APP_WORKDIR: "/opt/wings-control"
    working_dir: /opt
    command: >
      /bin/sh -c "
        mkdir -p /shared-volume /var/log/wings /opt/log_analyzer;
        ln -sf /opt/wings-control /opt/wings_control;
        echo '[control-d] Starting wings_control (PD_ROLE=D)...';
        python3 -m wings_control
      "
    volumes:
      - shared-vol-d:/shared-volume
      - /data/xqr/Qwen3-8B:/models/Qwen3-8B:ro
      - /data/zhanghui/wings-control:/opt/wings-control:ro

  engine-d:
    image: quay.io/ascend/vllm-ascend:v0.17.0rc1
    container_name: pd-test-engine-d
    network_mode: "host"
    shm_size: "16g"
    restart: "no"
    ipc: host
    environment:
      ASCEND_VISIBLE_DEVICES: "9"
      ASCEND_RT_VISIBLE_DEVICES: "9"
    command: >
      /bin/sh -c "echo '[engine-d] Waiting for start_command.sh...';
      timeout=180; elapsed=0;
      while [ ! -f /shared-volume/start_command.sh ]; do
        sleep 2; elapsed=$$((elapsed+2));
        if [ $$elapsed -ge $$timeout ]; then
          echo '[engine-d] ERROR: Timeout waiting for start_command.sh';
          exit 1;
        fi;
      done;
      echo '[engine-d] Found start_command.sh after $${elapsed}s';
      echo '====== start_command.sh content ======';
      cat /shared-volume/start_command.sh;
      echo '======================================';
      bash /shared-volume/start_command.sh"
    volumes:
      - shared-vol-d:/shared-volume
      - /data/xqr/Qwen3-8B:/models/Qwen3-8B:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - /etc/hccn.conf:/etc/hccn.conf:ro
    depends_on:
      - wings-control-d

volumes:
  shared-vol-p:
  shared-vol-d:
