      DeepSeek-R1-Distill-Llama-8B: {vllm: llama3_json, vllm_ascend: llama3_json, sglang: llama3}
      DeepSeek-R1-Distill-Llama-70B: {vllm: llama3_json, vllm_ascend: llama3_json, sglang: llama3}
