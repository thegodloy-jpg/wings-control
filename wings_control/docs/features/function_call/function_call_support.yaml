      sglang:      {default: qwen25}
      vllm_ascend: {default: hermes}
      mindie:      {default: qwen2_5}
    models:
      DeepSeek-R1-Distill-Qwen-1.5B: {vllm: hermes, vllm_ascend: hermes, sglang: qwen25, mindie: qwen2_5}
