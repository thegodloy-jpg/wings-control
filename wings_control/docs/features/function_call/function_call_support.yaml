      sglang:      {default: llama3}
      vllm_ascend: {default: llama3_json}
    models:
      LLaMA3-8B:                    {vllm: llama3_json, vllm_ascend: llama3_json, sglang: llama3}
      LLaMA3.1-70B:                 {vllm: llama3_json, vllm_ascend: llama3_json, sglang: llama3}
