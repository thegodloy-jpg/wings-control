      DeepSeek-R1-Distill-Qwen-14B:  {vllm: hermes, vllm_ascend: hermes, sglang: qwen25, mindie: qwen2_5}
      DeepSeek-R1-Distill-Qwen-32B:  {vllm: hermes, vllm_ascend: hermes, sglang: qwen25, mindie: qwen2_5}
      Qwen2.5-32B-Instruct:          {vllm: hermes, vllm_ascend: hermes, sglang: qwen25, mindie: qwen2_5}
      QwQ-32B:                       {vllm: hermes, vllm_ascend: hermes, sglang: qwen25, mindie: qwen2_5}

  - name: Qwen3ForCausalLM
    config:
      vllm:        {default: hermes}
      sglang:      {default: qwen}
      vllm_ascend: {default: hermes}
      mindie:      {default: qwen3}
    models:
      Qwen3-32B: {vllm: hermes, vllm_ascend: hermes, sglang: qwen, mindie: qwen3}

  - name: Qwen3MoeForCausalLM
