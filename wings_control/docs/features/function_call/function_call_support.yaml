      vllm:        {default: hermes, Qwen3-Coder-480B-A35B-Instruct: qwen3_coder, Qwen3-Coder-30B-A3B-Instruct: qwen3_coder}
      sglang:      {default: qwen, Qwen3-Coder-480B-A35B-Instruct: qwen3_coder, Qwen3-Coder-30B-A3B-Instruct: qwen3_coder}
      vllm_ascend: {default: hermes, Qwen3-235B-A22B: hermes}
      mindie:      {default: qwen3, Qwen3-235B-A22B: qwen3}
    models:
      Qwen3-30B-A3B:   {vllm: hermes, vllm_ascend: hermes, sglang: qwen, mindie: qwen3}
      Qwen3-235B-A22B: {vllm: hermes, vllm_ascend: hermes, sglang: qwen, mindie: qwen3}

  - name: Qwen3NextForCausalLM
