# Source of truth for wings-supported model SKUs and architecture metadata.
#
# Drives utils.model_utils.ModelIdentifier classification:
#   - identify_model_type() consults the (architecture, model name) tables to
#     decide whether a request targets llm / embedding / rerank.
#   - is_wings_supported() returns True iff the detected architecture is listed
#     here.
#   - INDEXCACHE_ARCHS is derived from entries where indexcache: true.
#
# Each entry is keyed by (architecture, type) so the same architecture may appear
# in multiple types (e.g. Qwen3ForCausalLM serves both llm chat and embedding).
schema_version: 1

