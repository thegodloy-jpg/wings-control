engine: mindie_distributed
env_policies:
  # ── Runtime-derived distributed coordinator (force_override) ────────────────
  - name: MASTER_ADDR
    mode: force_override
    applies_to_versions: ">=2.3.0"
    rationale: Coordinator address resolved by wings at launch from rank table.
    source_type: wings_decision
    decision_date: "2026-05-14"

  - name: MASTER_PORT
    mode: force_override
    applies_to_versions: ">=2.3.0"
    rationale: Coordinator port allocated by wings.
    source_type: wings_decision
    decision_date: "2026-05-14"

  - name: RANK
    mode: force_override
    applies_to_versions: ">=2.3.0"
    rationale: Per-process rank computed by wings from topology.
    source_type: wings_decision
    decision_date: "2026-05-14"

  - name: WORLD_SIZE
    mode: force_override
    applies_to_versions: ">=2.3.0"
    rationale: Total process count computed by wings from topology.
    source_type: wings_decision
    decision_date: "2026-05-14"

  - name: MINDIE_MODEL_WORLD_SIZE
    mode: force_override
    applies_to_versions: ">=2.3.0"
    rationale: Same value as WORLD_SIZE but consumed by MindIE-specific code paths.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: HCCL_WHITELIST_DISABLE
    mode: force_override
    default_value: "1"
    applies_to_versions: ">=2.3.0"
    applies_to_hardware: ["910b-32", "910b-64", "910c"]
    rationale: >
      Multi-node HCCL requires the whitelist to be disabled when the rank
      table is populated explicitly by wings. Operator-set values typically
      reflect single-node assumptions.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: MIES_CONTAINER_IP
    mode: force_override
    applies_to_versions: ">=2.3.0"
    rationale: Runtime-derived from container network namespace; user values are stale.
    source_type: wings_decision
    decision_date: "2026-05-14"

  - name: RANK_TABLE_FILE
    mode: force_override
    applies_to_versions: ">=2.3.0"
    rationale: Path to the rank table is generated by wings per-launch.
    source_type: wings_decision
    decision_date: "2026-05-14"

  # ── Tuned defaults (idempotent — operator can override) ─────────────────────
  - name: PYTORCH_NPU_ALLOC_CONF
    mode: idempotent
    default_value: "expandable_segments:True"
    applies_to_versions: ">=2.3.0"
    applies_to_hardware: ["910b-32", "910b-64", "910c"]
    rationale: >
      Reduces fragmentation in long-running MindIE distributed workers.
      Operator may override for short-context bench scenarios.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: OMP_NUM_THREADS
    mode: idempotent
    default_value: "10"
    applies_to_versions: ">=2.3.0"
    rationale: Distributed mode benefits from higher thread count than single-node default of 1.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: HCCL_DETERMINISTIC
    mode: idempotent
    default_value: "false"
    applies_to_versions: ">=2.3.0"
    rationale: Off by default; turn on only for reproducibility-critical benchmarks.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: HCCL_OP_EXPANSION_MODE
    mode: idempotent
    default_value: "AIV"
    applies_to_versions: ">=2.3.0"
    applies_to_hardware: ["910b-32", "910b-64", "910c"]
    rationale: AIV expansion mode is the validated default for current 910B/910C SKUs.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: ATB_LLM_HCCL_ENABLE
    mode: idempotent
    default_value: "1"
    applies_to_versions: ">=2.3.0"
    rationale: ATB-LLM HCCL backend must be on for distributed MindIE.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: ATB_LLM_COMM_BACKEND
    mode: idempotent
    default_value: "hccl"
    applies_to_versions: ">=2.3.0"
    rationale: HCCL is the canonical backend on Ascend; nccl is x86-only.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: INF_NAN_MODE_ENABLE
    mode: idempotent
    default_value: "0"
    applies_to_versions: ">=2.3.0"
    rationale: Off in production; on only for numerical debugging.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: ATB_WORKSPACE_MEM_ALLOC_ALG_TYPE
    mode: idempotent
    default_value: "3"
    applies_to_versions: ">=2.3.0"
    rationale: Validated workspace allocation algorithm for current ATB-models cookbook.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: ATB_WORKSPACE_MEM_ALLOC_GLOBAL
    mode: idempotent
    default_value: "1"
    applies_to_versions: ">=2.3.0"
    rationale: Global workspace pool reduces allocator churn for multi-iter prefill.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: TASK_QUEUE_ENABLE
    mode: idempotent
    default_value: "2"
    applies_to_versions: ">=2.3.0"
    rationale: Distributed mode uses queue level 2 (vs single-node 1) for higher concurrency.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: CPU_AFFINITY_CONF
    mode: idempotent
    default_value: "1"
    applies_to_versions: ">=2.3.0"
    rationale: Enable CPU affinity binding for stable per-rank performance.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: HCCL_CONNECT_TIMEOUT
    mode: idempotent
    default_value: "7200"
    applies_to_versions: ">=2.3.0"
    rationale: Multi-node bring-up may take minutes; default 600s is too short.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: HCCL_EXEC_TIMEOUT
    mode: idempotent
    default_value: "600"
    applies_to_versions: ">=2.3.0"
    rationale: Collective ops on long prefill stay under 10 minutes.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: ASCEND_GLOBAL_LOG_LEVEL
    mode: idempotent
    default_value: "3"
    applies_to_versions: ">=2.3.0"
    rationale: Level 3 = error; verbose levels generate excessive disk usage in distributed runs.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: ASCEND_SLOG_PRINT_TO_STDOUT
    mode: idempotent
    default_value: "0"
    applies_to_versions: ">=2.3.0"
    rationale: Kubernetes uses stdout for container logs; slog already covers this.
    source_type: vendor_doc
    decision_date: "2026-05-14"

  - name: MINDIE_LOG_TO_STDOUT
    mode: force_override
    default_value: "1"
    applies_to_versions: ">=2.3.0"
    rationale: Same rationale as mindie.yaml — container runtimes require stdout logs.
    source_type: wings_decision
    decision_date: "2026-05-14"
